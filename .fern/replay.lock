      .github/workflows/ci.yml: |
        name: ci

        on: [push]

        concurrency:
          group: ${{ github.workflow }}-${{ github.ref }}
          cancel-in-progress: false

        jobs:
          compile:
            runs-on: ubuntu-latest
            steps:
              - name: Checkout repo
                uses: actions/checkout@v4
              - name: Set up python
                uses: actions/setup-python@v4
                with:
                  python-version: "3.10"
              - name: Bootstrap poetry
                run: |
                  curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
              - name: Install dependencies
                run: poetry install
              - name: Compile
                run: poetry run mypy .
          test:
            runs-on: ubuntu-latest
            steps:
              - name: Checkout repo
                uses: actions/checkout@v4
              - name: Set up python
                uses: actions/setup-python@v4
                with:
                  python-version: "3.10"
              - name: Bootstrap poetry
                run: |
                  curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
              - name: Install dependencies
                run: poetry install

              - name: Test
                run: poetry run pytest -rP -n auto .

              - name: Install aiohttp extra
                run: poetry install --extras aiohttp

              - name: Test (aiohttp)
                run: poetry run pytest -rP -n auto -m aiohttp .

          build:
            name: Build distribution
            runs-on: ubuntu-latest
            steps:
              - name: Checkout repo
                uses: actions/checkout@v4
              - name: Set up python
                uses: actions/setup-python@v4
                with:
                  python-version: "3.10"
              - name: Bootstrap poetry
                run: |
                  curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
              - name: Install dependencies
                run: poetry install
              - name: Build package
                run: poetry build
              - name: Verify the wheel as a consumer
                run: |
                  python -m venv /tmp/alpha-sdk-consumer
                  /tmp/alpha-sdk-consumer/bin/pip install dist/*.whl
                  /tmp/alpha-sdk-consumer/bin/python -c "from alpha import Alpha, AsyncAlpha; Alpha(token='test'); AsyncAlpha(token='test')"
              - name: Store the distribution packages
                uses: actions/upload-artifact@v4
                with:
                  name: python-package-distributions
                  path: dist/

          publish:
            name: Publish to PyPI
            needs: [compile, test, build]
            if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
            runs-on: ubuntu-latest
            environment:
              name: pypi
              url: https://pypi.org/project/openantares-alpha/
            permissions:
              contents: read   # Required for checkout
              id-token: write  # Required for OIDC
            steps:
              - name: Download all the dists
                uses: actions/download-artifact@v4
                with:
                  name: python-package-distributions
                  path: dist/
              - name: Publish to pypi with attestations
                uses: pypa/gh-action-pypi-publish@release/v1
                with:
                  repository-url: https://upload.pypi.org/legacy/
